services:
  postgres:
    image: postgres:15-alpine
    container_name: medassist_postgres
    restart: always
    environment:
      POSTGRES_USER: medassist_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_DB_PASSWORD}
      POSTGRES_DB: medassist_db
    # Prefer not publishing DB ports in production; keep for local dev only.
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medassist_user -d medassist_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional / unused by current JWT auth — kept for future IdP work. Change password via env.
  keycloak:
    image: quay.io/keycloak/keycloak:22.0
    container_name: medassist_keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-CHANGE_ME_KEYCLOAK_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    profiles:
      - keycloak

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medassist_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql+psycopg2://medassist_user:${POSTGRES_PASSWORD:-CHANGE_ME_DB_PASSWORD}@postgres:5432/medassist_db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-CHANGE_ME_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-CHANGE_ME_ADMIN_PASSWORD}
      - LLM_API_URL=${LLM_API_URL:-http://127.0.0.1:11434/api/generate}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-qwen2.5:7b}
      - LLM_ALLOWED_HOSTS=${LLM_ALLOWED_HOSTS:-127.0.0.1,localhost}
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
